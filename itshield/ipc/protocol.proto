syntax = "proto3";

package itshield;

// ITShield IPC Protocol - Version 1
//
// The ITShield core service speaks a request/response protocol over a
// single socket (Unix Domain Socket on Linux, Named Pipe on Windows).
//
// Wire format (section 13.1 of the architecture document):
//     [ 4-byte big-endian length ][ length bytes of serialized Request/Response ]
//
// Maximum message size: 1 MiB (1_048_576 bytes).
//
// Operations (section 13.4):
//     "core.status"     -> returns full CoreManager.status() dict in `data`
//     "core.health"     -> returns compact CoreManager.health() dict in `data`
//     "scan.request"    -> currently returns SCANNER_NOT_IMPLEMENTED
//                          (Scanner not yet wired to IPC; use CLI for now)

import "google/protobuf/struct.proto";

message Request {
    // Operation name, e.g. "core.status". Dotted namespacing on purpose.
    string operation = 1;

    // Free-form parameters carried as a Struct so we can evolve the protocol
    // without re-generating stubs every time.
    google.protobuf.Struct params = 2;
}

message Response {
    // True when the operation was understood and succeeded.
    bool success = 1;

    // Stable error code on failure (e.g. "UNKNOWN_OPERATION",
    // "SCANNER_NOT_IMPLEMENTED"). Empty on success.
    string error_code = 2;

    // Human-readable error message (empty on success).
    string error_message = 3;

    // Operation-specific result payload (JSON-shaped via Struct).
    google.protobuf.Struct data = 4;
}
