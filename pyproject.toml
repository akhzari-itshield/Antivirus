[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itshield-antivirus"
version = "1.1.1"
description = "ITShield Antivirus v1.1.0 - Endpoint Protection Platform (15 phases: Core, IPC, Scanner, Risk Engine, Quarantine, Real-Time Protection, Process/Network/Registry Monitors, Correlation Engine, Behavior Analyzer, Incident Manager, Update System with 12 YARA sources + MalwareBazaar + Ed25519 + 3 IOC feeds + IOC Matcher + Sandbox Analyzer, Reporting, systemd, Statistics, Settings I/O, Debian/RPM/Docker packaging, Windows support, Native Rust extension, Refined GUI, Full RTL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "ITShield Team" }
]
keywords = ["antivirus", "edr", "endpoint-security", "yara", "malware-detection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: C++",
    "Topic :: Security",
]

dependencies = [
    "protobuf>=4.25",
    "yara-python>=4.3",
    "PySide6>=6.5",
    "inotify-simple>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "maturin>=1.4",
]

[project.scripts]
itshield = "itshield.cli:main"
itshield-gui = "itshield.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["itshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
